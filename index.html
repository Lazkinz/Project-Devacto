<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Goldnotes - Band Indie</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #121212; color: #f1c40f; font-family: sans-serif; text-align: center; padding: 20px; }
    header, nav, main, footer { border: 1px solid #f1c40f; margin: 10px 0; padding: 15px; border-radius: 8px; }
    a { color: #f1c40f; margin: 0 10px; text-decoration: none; font-weight: bold; }
    
    /* Animation Vinyl */
    .vinyl { width: 120px; height: 120px; border-radius: 50%; border: 8px solid #333; cursor: pointer; margin: 10px auto; transition: transform 0.5s; }
    .vinyl.spin { animation: spin 2s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Flexbox Layout Galeri */
    .gallery { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
    .gallery img { width: 100%; max-width: 200px; height: 130px; object-fit: cover; border: 2px solid #f1c40f; }

    /* Form UI */
    form { display: flex; flex-direction: column; gap: 8px; max-width: 300px; margin: auto; }
    input, select, button { padding: 8px; background: #222; color: #fff; border: 1px solid #f1c40f; border-radius: 4px; }
    button { background: #f1c40f; color: #000; font-weight: bold; cursor: pointer; }

    /* Responsif Mobile */
    @media (max-width: 768px) {
      .gallery { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>

  <!-- 1. Header & Nav (Semantik) -->
  <header>
    <h1>THE GOLDNOTES</h1>
    <p>Indie Rock Band - Jakarta</p>
    <nav>
      <a href="#about">Tentang</a>
      <a href="#music">Musik</a>
      <a href="#contact">Kontak</a>
    </nav>
  </header>

  <!-- 2. Main Content (Semantik) -->
  <main>
    <section id="about">
      <h2>Tentang Kami</h2>
      <p>Kami adalah band indie bernuansa retro-modern dengan sentuhan nada emas.</p>
    </section>

    <section id="music">
      <h2>Putar Vinyl (Klik Gambar)</h2>
      <!-- Image Vinyl + Link Youtube -->
      <img id="vinylPic" class="vinyl" src="https://images.unsplash.com/photo-1539375665275-f9de415ef9ac?w=200" alt="Vinyl Record" onclick="playMusic()">
      
      <h3>Galeri Tour</h3>
      <div class="gallery">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300" alt="Konser 1">
        <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300" alt="Konser 2">
      </div>
    </section>

    <!-- 3. Form Interaktif Statis -->
    <section id="contact">
      <h2>Pesan Tiket / Booking</h2>
      <form onsubmit="alert('Pesan terkirim!'); return false;">
        <input type="text" placeholder="Nama Lengkap" required>
        <input type="email" placeholder="Email Anda" required>
        <select>
          <option>Pilih Kota Konser</option>
          <option>Jakarta</option>
          <option>Bandung</option>
        </select>
        <button type="submit">Kirim</button>
      </form>
    </section>
  </main>

  <!-- 4. Footer (Semantik) -->
  <footer>
    <p>&copy; 2026 The Goldnotes. All rights reserved.</p>
  </footer>

  <!-- Fitur JS Vinyl Sederhana -->
  <script>
    function playMusic() {
      const vinyl = document.getElementById('vinylPic');
      vinyl.classList.toggle('spin');
      // Ganti link Youtube di bawah sesuai lagumu
      window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ', '_blank');
    }
  </script>

</body>
</html>
